[project]
name = "rag-eval"
version = "0.1.0"
description = "RAG pipeline evaluation framework – parse, chunk, embed, retrieve, generate, and evaluate."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: needs real services (Ollama, APIs); skipped by default",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.taskipy.tasks]
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy core apps eval"
test = "pytest"

[dependency-groups]
bench = [
    "psutil>=6.1.1",
]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "taskipy>=1.14.1",
    "types-pyyaml>=6.0.12.20260906",
]
