services:
  - type: web
    name: rag-eval-web
    runtime: docker
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    dockerCommand: /bin/sh -c 'exec uv run uvicorn apps.api.main:app --host 0.0.0.0 --port "$PORT"'
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_BACKEND
        value: s3
      - key: DATABASE_URL
        sync: false
      - key: WORKER_DATABASE_URL
        sync: false
      - key: SKIP_RLS_SETUP
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: SKIP_SCHEMA_INIT
        value: "true"
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
      - key: INVITATION_ADMIN_TOKEN
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      - key: OLLAMA_MODEL
        value: llama3.2:3b
