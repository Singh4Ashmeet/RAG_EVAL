<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18241D" />
      <stop offset="100%" stop-color="#101914" />
    </linearGradient>
    <linearGradient id="ci-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3FA66F" />
      <stop offset="100%" stop-color="#5CD692" />
    </linearGradient>
  </defs>
  <rect width="480" height="320" rx="12" fill="url(#ph-bg)" />
  <rect x="20" y="20" width="440" height="280" rx="8" stroke="#2B3C30" stroke-width="1" />

  <!-- Comparison Header -->
  <g transform="translate(40, 36)">
    <rect width="400" height="48" rx="6" fill="#142018" stroke="#2A4232" stroke-width="1" />
    <text x="16" y="22" fill="#88A392" font-family="ui-monospace, monospace" font-size="9">PAIRED EXPERIMENT COMPARISON</text>
    <text x="16" y="38" fill="#F0F5F2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Baseline (depth-3) vs Candidate (depth-5)</text>
    <rect x="310" y="14" width="76" height="20" rx="4" fill="#203828" />
    <text x="318" y="28" fill="#78E6AA" font-family="ui-monospace, monospace" font-size="9">SEED: 0 FIXED</text>
  </g>

  <!-- Distribution Curves / Hypothesis Testing -->
  <g transform="translate(40, 102)">
    <text x="0" y="14" fill="#88A392" font-family="ui-monospace, monospace" font-size="10" font-weight="600">1,000 BOOTSTRAP RESAMPLES · DELTA ESTIMATE</text>

    <!-- Gaussian Curve Visual -->
    <g transform="translate(0, 30)">
      <!-- Baseline distribution bell curve -->
      <path d="M 40 100 Q 120 100 140 30 Q 160 100 240 100" fill="#24342A" fill-opacity="0.5" stroke="#486B54" stroke-width="1.5" />
      <!-- Candidate distribution bell curve -->
      <path d="M 160 100 Q 240 100 260 20 Q 280 100 360 100" fill="#2F5D46" fill-opacity="0.4" stroke="#5CD692" stroke-width="2" />

      <!-- Center lines -->
      <line x1="140" y1="30" x2="140" y2="100" stroke="#759382" stroke-width="1" stroke-dasharray="2 2" />
      <text x="120" y="114" fill="#88A392" font-family="ui-monospace, monospace" font-size="9">0.781</text>
      <text x="120" y="22" fill="#B3CCC0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9">depth-3</text>

      <line x1="260" y1="20" x2="260" y2="100" stroke="#5CD692" stroke-width="1.5" stroke-dasharray="2 2" />
      <text x="240" y="114" fill="#7EE7AE" font-family="ui-monospace, monospace" font-size="9">0.923</text>
      <text x="240" y="12" fill="#5CD692" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700">depth-5</text>
    </g>

    <!-- 95% Confidence Interval Band -->
    <g transform="translate(0, 150)">
      <rect width="400" height="34" rx="4" fill="#141E17" stroke="#253A2C" stroke-width="1" />
      <text x="12" y="21" fill="#A8BFB0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Mean Δ: <tspan fill="#7EF5B5">+0.142</tspan></text>
      <text x="160" y="21" fill="#759382" font-family="ui-monospace, monospace" font-size="10">95% CI: [+0.082, +0.208]</text>
      <rect x="330" y="8" width="56" height="18" rx="3" fill="#243C2C" />
      <text x="336" y="21" fill="#7EE7AE" font-family="ui-monospace, monospace" font-size="9">p &lt; 0.001</text>
    </g>
  </g>
</svg>
