# Local dense retrieval baseline. The Ollama model must be installed separately.
embedding:
  provider: ollama
  model: "${OLLAMA_EMBED_MODEL}"

storage:
  provider: sqlite
  path: data/rag_eval.sqlite3

retrieval:
  strategy: dense
  top_k: 5
  score: cosine_similarity

generation:
  provider: ollama
  model: "${OLLAMA_MODEL}"
  temperature: 0.0
  max_tokens: 512

evaluation:
  cutoffs: [1, 3, 5]
